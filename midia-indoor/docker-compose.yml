services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: midia_indoor
      POSTGRES_USER: midia
      POSTGRES_PASSWORD: midia
    ports: ["5433:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U midia -d midia_indoor"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    env_file:
      - path: .env
        required: false
    ports: ["4000:4000"]
    volumes: ["uploads:/app/public/uploads"]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
  uploads:
